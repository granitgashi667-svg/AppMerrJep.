<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Kosova — Makinat e Importuara</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: system-ui, sans-serif; background:#f5f6f8; color:#0f172a; padding:20px; }
.container { max-width:1300px; margin:0 auto; }
h1 { font-size:28px; margin-bottom:6px; }
.subtitle { color:#64748b; margin-bottom:30px; }

.cars-grid { display:grid; grid-template-columns:1fr; gap:20px; }
@media (min-width:640px) { .cars-grid { grid-template-columns:repeat(2,1fr); } }
@media (min-width:1024px) { .cars-grid { grid-template-columns:repeat(4,1fr); } }

.car-card {
  background:#fff; border-radius:14px; overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.06);
  transition:transform .25s;
  display:flex; flex-direction:column;
}
.car-card:hover { transform:translateY(-4px); box-shadow:0 12px 30px rgba(0,0,0,.12); }
.car-card-img { width:100%; aspect-ratio:16/10; object-fit:cover; background:#e2e8f0; }
.car-card-body { padding:16px; display:flex; flex-direction:column; gap:8px; flex:1; }
.car-title { font-size:16px; font-weight:600; line-height:1.3; }
.car-meta { display:flex; flex-wrap:wrap; gap:10px; font-size:13px; color:#64748b; }
.car-price {
  font-size:20px; font-weight:700; color:#2563eb;
  margin-top:auto; padding-top:8px; border-top:1px solid #f1f5f9;
}
.loading, .error { text-align:center; padding:60px 20px; color:#64748b; }
.error { color:#dc2626; }
</style>
</head>
<body>
<div class="container">
  <h1>Makinat e Importuara</h1>
  <p class="subtitle">Nga tregu korean — përditësohet automatikisht</p>
  <div id="cars-container" class="cars-grid">
    <div class="loading">Duke ngarkuar makinat...</div>
  </div>
</div>

<script>
const KRW_TO_EUR = 0.00067;

function calculateFinalPrice(priceKrw) {
  const base = priceKrw * KRW_TO_EUR;
  let markup;
  if (base < 15000) markup = 300;
  else if (base < 30000) markup = 450;
  else if (base < 50000) markup = 700;
  else markup = 1000;
  return Math.round(base + markup);
}

function formatNumber(n) { return n.toLocaleString('de-DE'); }

async function loadCars() {
  const container = document.getElementById('cars-container');
  try {
    const res = await fetch('cars.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const cars = await res.json();

    if (!Array.isArray(cars) || cars.length === 0) {
      container.innerHTML = '<div class="loading">Nuk ka makina.</div>';
      return;
    }

    container.innerHTML = '';
    cars.forEach(car => {
      const finalPrice = calculateFinalPrice(car.price_krw || 0);
      const card = document.createElement('div');
      card.className = 'car-card';
      card.innerHTML = `
        <img class="car-card-img" src="${car.image_url || ''}" loading="lazy"
             onerror="this.src='https://via.placeholder.com/400x250?text=Pa+Foto'">
        <div class="car-card-body">
          <div class="car-title">${car.make || ''} ${car.model || ''}</div>
          <div class="car-meta">
            <span>📅 ${car.year || 'N/A'}</span>
            <span>🛣 ${formatNumber(car.mileage_km || 0)} km</span>
            <span>⛽ ${car.fuel_type || 'N/A'}</span>
          </div>
          <div class="car-price">€ ${formatNumber(finalPrice)}</div>
        </div>`;
      container.appendChild(card);
    });
  } catch (e) {
    container.innerHTML = '<div class="error">Gabim: ' + e.message + '</div>';
  }
}
loadCars();
</script>
</body>
</html>
