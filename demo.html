<!DOCTYPE html>
<html lang="sq" data-theme="aurum">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Kosova — 5 Dizajne</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=Oswald:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body { min-height:100vh; overflow-x:hidden; }
img { max-width:100%; display:block; }
a { color:inherit; text-decoration:none; transition:.25s; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
.container { width: min(1320px, 92%); margin: 0 auto; }

/* ===== THEME SWITCHER ===== */
.theme-switch {
  position: fixed; top: 20px; right: 20px; z-index: 99999;
  display: flex; gap: 8px; padding: 8px;
  background: rgba(15,15,15,.9); backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.12); border-radius: 999px;
  box-shadow: 0 10px 40px rgba(0,0,0,.6);
}
.theme-btn {
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 10px; font-weight: 800; color: #fff;
  border: 2px solid transparent; transition: .25s;
  font-family: 'Inter', sans-serif; letter-spacing: .5px;
}
.theme-btn:hover { transform: scale(1.12); }
.theme-btn.active { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.25); }
.theme-btn[data-set="aurum"]  { background: linear-gradient(135deg, #0a0a0a 40%, #c9a961); }
.theme-btn[data-set="nordic"] { background: linear-gradient(135deg, #ffffff 40%, #2563eb); color: #0f172a; }
.theme-btn[data-set="neon"]   { background: linear-gradient(135deg, #05060a 40%, #00e5ff); }
.theme-btn[data-set="carbon"] { background: linear-gradient(135deg, #0a0a0a 40%, #dc2626); }
.theme-btn[data-set="forest"] { background: linear-gradient(135deg, #0c1210 40%, #10b981); }

/* =========================================================
   TEMA 1 — AURUM
   Split hero, list cards, serif, ar i errët
   ========================================================= */
body[data-theme="aurum"] {
  background:#0a0a0a; color:#f4f4f4; font-family:'Inter',sans-serif;
}
/* Header */
.aurum-header {
  position:fixed; top:0; left:0; right:0; z-index:100;
  padding:22px 0; background:rgba(10,10,10,.9); backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(201,169,97,.15);
}
.aurum-header-inner { display:flex; justify-content:space-between; align-items:center; }
.aurum-logo {
  font-family:'Cormorant Garamond',serif; font-size:26px;
  letter-spacing:5px; color:#c9a961; font-weight:600;
}
.aurum-logo span { color:#f4f4f4; font-weight:400; }
.aurum-nav { display:flex; gap:36px; }
.aurum-nav a {
  font-size:12px; letter-spacing:3px; text-transform:uppercase;
  color:#8a8a8a; font-weight:500;
}
.aurum-nav a:hover { color:#c9a961; }
.aurum-btn {
  padding:12px 28px; border:1px solid #c9a961; color:#c9a961;
  font-size:11px; letter-spacing:3px; text-transform:uppercase;
  font-weight:600; transition:.3s;
}
.aurum-btn:hover { background:#c9a961; color:#0a0a0a; }
.aurum-btn-solid { background:#c9a961; color:#0a0a0a; }
.aurum-btn-solid:hover { background:#e6c988; }

/* Hero — SPLIT (text left, image right) */
.aurum-hero {
  min-height:100vh; padding:120px 0 60px;
  display:grid; grid-template-columns:1fr 1fr; align-items:center;
}
.aurum-hero-left {
  padding:60px 0 60px 8%;
  display:flex; flex-direction:column; gap:28px;
  max-width:640px;
}
.aurum-tag {
  display:inline-flex; align-items:center; gap:14px;
  font-size:11px; letter-spacing:5px; text-transform:uppercase;
  color:#c9a961; font-weight:600;
}
.aurum-tag::before { content:''; width:50px; height:1px; background:#c9a961; }
.aurum-hero h1 {
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(52px,6.5vw,92px);
  font-weight:400; line-height:1; letter-spacing:-1.5px;
}
.aurum-hero h1 em { color:#c9a961; font-style:italic; }
.aurum-hero p { color:#8a8a8a; font-size:17px; max-width:480px; line-height:1.7; }
.aurum-hero-actions { display:flex; gap:16px; flex-wrap:wrap; margin-top:8px; }
.aurum-hero-right {
  height:100vh; position:relative; overflow:hidden;
  background:url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=1400&q=90') center/cover;
}
.aurum-hero-right::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg, #0a0a0a 0%, transparent 40%);
}
.aurum-hero-num {
  position:absolute; bottom:60px; right:60px; z-index:2;
  font-family:'Cormorant Garamond',serif; font-size:120px;
  color:rgba(201,169,97,.25); font-weight:700; line-height:1;
}

/* Section */
.aurum-section { padding:130px 0; }
.aurum-section-head { text-align:center; margin-bottom:80px; }
.aurum-section-tag {
  font-size:11px; letter-spacing:6px; text-transform:uppercase;
  color:#c9a961; margin-bottom:20px; display:block; font-weight:600;
}
.aurum-section-title {
  font-family:'Cormorant Garamond',serif; font-size:clamp(40px,5vw,68px);
  font-weight:400; line-height:1.05; letter-spacing:-1px;
}
.aurum-section-title em { color:#c9a961; font-style:italic; }

/* List cards — horizontal */
.aurum-list { display:flex; flex-direction:column; gap:0; }
.aurum-item {
  display:grid; grid-template-columns:1fr 1.2fr 1fr; gap:40px;
  padding:36px 0; border-bottom:1px solid rgba(201,169,97,.15);
  align-items:center; transition:.4s;
}
.aurum-item:hover { background:rgba(201,169,97,.03); padding-left:20px; }
.aurum-item:first-child { border-top:1px solid rgba(201,169,97,.15); }
.aurum-item-info h3 {
  font-family:'Cormorant Garamond',serif; font-size:32px;
  font-weight:500; margin-bottom:8px;
}
.aurum-item-brand {
  font-size:11px; letter-spacing:3px; text-transform:uppercase;
  color:#c9a961; margin-bottom:10px;
}
.aurum-item-specs { display:flex; gap:20px; color:#8a8a8a; font-size:13px; }
.aurum-item-img {
  aspect-ratio:16/9; overflow:hidden; background:#000;
}
.aurum-item-img img { width:100%; height:100%; object-fit:cover; transition:1s; }
.aurum-item:hover .aurum-item-img img { transform:scale(1.05); }
.aurum-item-right { text-align:right; }
.aurum-item-price {
  font-family:'Cormorant Garamond',serif; font-size:36px;
  color:#c9a961; font-weight:500; display:block; margin-bottom:14px;
}

/* Footer */
.aurum-footer {
  padding:80px 0 40px; border-top:1px solid rgba(201,169,97,.15);
  text-align:center; color:#5a5a5a; font-size:13px;
}
.aurum-footer-logo {
  font-family:'Cormorant Garamond',serif; font-size:32px;
  color:#c9a961; letter-spacing:6px; margin-bottom:20px;
  display:inline-block;
}

/* =========================================================
   TEMA 2 — NORDIC
   Full-bleed hero me card overlay, grid 4-col, clean
   ========================================================= */
body[data-theme="nordic"] {
  background:#f5f6f8; color:#0f172a; font-family:'Inter',sans-serif;
}
.nordic-header {
  position:sticky; top:0; z-index:100;
  background:rgba(255,255,255,.92); backdrop-filter:blur(20px);
  border-bottom:1px solid #e5e7eb;
  padding:16px 0;
}
.nordic-header-inner { display:flex; align-items:center; justify-content:space-between; gap:30px; }
.nordic-logo {
  font-family:'Space Grotesk',sans-serif; font-weight:700;
  font-size:20px; display:flex; align-items:center; gap:10px;
}
.nordic-logo-mark {
  width:34px; height:34px; border-radius:9px; background:#2563eb;
  display:grid; place-items:center; color:#fff; font-size:14px;
}
.nordic-logo em { font-style:normal; color:#2563eb; }
.nordic-nav { display:flex; gap:30px; }
.nordic-nav a {
  font-size:14px; font-weight:500; color:#64748b;
}
.nordic-nav a:hover { color:#2563eb; }
.nordic-btn {
  padding:11px 22px; border-radius:10px;
  background:#2563eb; color:#fff; font-weight:600; font-size:14px;
  transition:.2s;
}
.nordic-btn:hover { background:#1d4ed8; transform:translateY(-1px); }
.nordic-btn-outline {
  padding:11px 22px; border-radius:10px;
  border:1px solid #e5e7eb; color:#0f172a; font-weight:600; font-size:14px;
  background:#fff;
}
.nordic-btn-outline:hover { border-color:#2563eb; color:#2563eb; }

/* Hero — FULLSCREEN IMAGE me info card */
.nordic-hero {
  position:relative; height:calc(100vh - 70px); min-height:600px;
  margin:0; overflow:hidden;
}
.nordic-hero-img {
  position:absolute; inset:0;
  background:url('https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=1920&q=90') center/cover;
}
.nordic-hero-card {
  position:absolute; bottom:60px; left:6%;
  background:#fff; padding:44px 48px; max-width:520px;
  border-radius:20px; box-shadow:0 30px 80px rgba(0,0,0,.15);
}
.nordic-hero-tag {
  display:inline-flex; align-items:center; gap:8px;
  padding:8px 14px; border-radius:999px;
  background:rgba(37,99,235,.1); color:#2563eb;
  font-size:13px; font-weight:600; margin-bottom:20px;
}
.nordic-hero-tag::before {
  content:''; width:7px; height:7px; border-radius:50%; background:#2563eb;
}
.nordic-hero h1 {
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(36px,4.5vw,56px); font-weight:700;
  line-height:1.05; letter-spacing:-1.5px; margin-bottom:16px;
}
.nordic-hero p { color:#64748b; margin-bottom:26px; font-size:16px; }
.nordic-hero-actions { display:flex; gap:10px; flex-wrap:wrap; }

/* Stats bar */
.nordic-stats {
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:0; background:#fff;
  border-bottom:1px solid #e5e7eb;
}
.nordic-stat {
  padding:36px 24px; text-align:center;
  border-right:1px solid #e5e7eb;
}
.nordic-stat:last-child { border-right:none; }
.nordic-stat-num {
  font-family:'Space Grotesk',sans-serif; font-size:36px;
  font-weight:700; color:#0f172a; line-height:1;
}
.nordic-stat-label {
  font-size:13px; color:#64748b; margin-top:8px;
}

/* Section */
.nordic-section { padding:90px 0; }
.nordic-section-head {
  display:flex; justify-content:space-between; align-items:end;
  margin-bottom:44px; flex-wrap:wrap; gap:20px;
}
.nordic-section-title {
  font-family:'Space Grotesk',sans-serif; font-size:clamp(28px,3.5vw,44px);
  font-weight:700; letter-spacing:-1.5px;
}

/* Grid 4-col compact */
.nordic-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
  gap:20px;
}
.nordic-card {
  background:#fff; border-radius:14px; overflow:hidden;
  border:1px solid #e5e7eb; transition:.3s;
  cursor:pointer;
}
.nordic-card:hover {
  transform:translateY(-4px); box-shadow:0 20px 40px rgba(0,0,0,.08);
  border-color:transparent;
}
.nordic-card-img {
  aspect-ratio:16/10; overflow:hidden; background:#f1f5f9;
  position:relative;
}
.nordic-card-img img { width:100%; height:100%; object-fit:cover; }
.nordic-card-tag {
  position:absolute; top:12px; left:12px;
  background:#fff; padding:5px 12px; border-radius:999px;
  font-size:11px; font-weight:700; color:#2563eb;
  letter-spacing:.5px; text-transform:uppercase;
}
.nordic-card-body { padding:18px; }
.nordic-card-title {
  font-family:'Space Grotesk',sans-serif; font-size:17px;
  font-weight:600; margin-bottom:4px;
}
.nordic-card-sub { font-size:12px; color:#64748b; margin-bottom:14px; }
.nordic-card-footer {
  display:flex; justify-content:space-between; align-items:center;
  padding-top:14px; border-top:1px solid #f1f5f9;
}
.nordic-card-price {
  font-family:'Space Grotesk',sans-serif; font-size:20px;
  font-weight:700; color:#2563eb;
}

/* =========================================================
   TEMA 3 — NEON
   Hero centered me tekst gjigant, horizontal scroll cards
   ========================================================= */
body[data-theme="neon"] {
  background:#05060a; color:#e8eaf0; font-family:'Rajdhani',sans-serif;
}
body[data-theme="neon"]::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:1;
  background:
    radial-gradient(circle at 20% 30%, rgba(0,229,255,.08), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(255,61,0,.06), transparent 40%);
}
.neon-header {
  position:fixed; top:0; left:0; right:0; z-index:100;
  padding:20px 0; background:rgba(5,6,10,.85);
  backdrop-filter:blur(20px); border-bottom:1px solid #1a1d28;
}
.neon-header-inner { display:flex; justify-content:space-between; align-items:center; }
.neon-logo {
  font-family:'Orbitron',sans-serif; font-weight:900;
  font-size:18px; letter-spacing:4px;
  display:flex; align-items:center; gap:12px;
}
.neon-logo-mark {
  width:38px; height:38px; background:linear-gradient(135deg,#00e5ff,#ff3d00);
  clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  display:grid; place-items:center; color:#000; font-size:14px;
}
.neon-logo em { font-style:normal; color:#00e5ff; }
.neon-nav { display:flex; gap:32px; }
.neon-nav a {
  font-size:13px; letter-spacing:2px; text-transform:uppercase;
  color:#6b7280; font-weight:600;
}
.neon-nav a:hover {
  color:#00e5ff; text-shadow:0 0 12px #00e5ff;
}
.neon-btn {
  padding:12px 26px;
  font-family:'Orbitron',sans-serif; font-size:11px; font-weight:700;
  letter-spacing:2px; text-transform:uppercase;
  background:#00e5ff; color:#000;
  clip-path:polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  box-shadow:0 0 24px rgba(0,229,255,.4); transition:.3s;
}
.neon-btn:hover {
  background:#fff; box-shadow:0 0 40px rgba(0,229,255,.8);
}

/* Hero — CENTERED me tekst GJIGANT */
.neon-hero {
  min-height:100vh; padding:160px 0 80px;
  position:relative; display:flex; align-items:center;
  overflow:hidden;
}
.neon-hero-bg {
  position:absolute; inset:0;
  background:url('https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=1920&q=90') center/cover;
  opacity:.35; filter:contrast(1.2) saturate(1.3);
}
.neon-hero-bg::after {
  content:''; position:absolute; inset:0;
  background:
    linear-gradient(180deg, rgba(5,6,10,.6) 0%, rgba(5,6,10,.95) 100%),
    repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,229,255,.04) 3px, rgba(0,229,255,.04) 4px);
}
.neon-hero-content {
  position:relative; z-index:2; text-align:center;
  width:100%;
}
.neon-hero-status {
  display:inline-flex; align-items:center; gap:12px;
  padding:10px 22px; border:1px solid #00e5ff; color:#00e5ff;
  font-family:'Orbitron',sans-serif; font-size:11px;
  letter-spacing:4px; text-transform:uppercase; margin-bottom:36px;
  box-shadow:0 0 30px rgba(0,229,255,.3), inset 0 0 30px rgba(0,229,255,.1);
}
.neon-hero-status::before {
  content:''; width:8px; height:8px; border-radius:50%; background:#00e5ff;
  box-shadow:0 0 10px #00e5ff; animation:pulseN 1.4s infinite;
}
@keyframes pulseN { 0%,100%{opacity:1} 50%{opacity:.3} }
.neon-hero h1 {
  font-family:'Orbitron',sans-serif; font-weight:900;
  font-size:clamp(56px,10vw,160px); line-height:.9;
  letter-spacing:-4px; margin-bottom:26px;
}
.neon-hero h1 .grad {
  background:linear-gradient(135deg, #00e5ff 0%, #ff3d00 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
}
.neon-hero p {
  font-size:18px; color:#9ca3af; max-width:640px;
  margin:0 auto 44px; font-weight:500; letter-spacing:.5px;
}
.neon-hero-actions { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
.neon-btn-orange {
  padding:12px 26px;
  font-family:'Orbitron',sans-serif; font-size:11px; font-weight:700;
  letter-spacing:2px; text-transform:uppercase;
  background:transparent; color:#ff3d00; border:1px solid #ff3d00;
  clip-path:polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
}

/* Section — HORIZONTAL SCROLL */
.neon-section { padding:110px 0; position:relative; z-index:2; }
.neon-section-head {
  text-align:center; margin-bottom:60px;
}
.neon-section-tag {
  font-family:'Orbitron',sans-serif; font-size:11px;
  letter-spacing:6px; text-transform:uppercase;
  color:#00e5ff; margin-bottom:18px; display:block;
}
.neon-section-title {
  font-family:'Orbitron',sans-serif; font-weight:900;
  font-size:clamp(36px,5vw,68px); letter-spacing:-2px; line-height:1;
}
.neon-section-title .grad {
  background:linear-gradient(135deg, #00e5ff, #ff3d00);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* HORIZONTAL SCROLL */
.neon-scroll {
  display:flex; gap:24px; overflow-x:auto;
  padding:20px 4% 40px;
  scroll-snap-type:x mandatory;
  scrollbar-width:thin; scrollbar-color:#00e5ff transparent;
}
.neon-scroll::-webkit-scrollbar { height:6px; }
.neon-scroll::-webkit-scrollbar-track { background:#0d0f16; }
.neon-scroll::-webkit-scrollbar-thumb { background:#00e5ff; }
.neon-card {
  flex:0 0 380px; scroll-snap-align:start;
  background:#0d0f16; border:1px solid #1a1d28;
  position:relative; overflow:hidden; transition:.4s;
  cursor:pointer;
}
.neon-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg, #00e5ff, #ff3d00);
  transform:scaleX(0); transform-origin:left; transition:.4s;
  z-index:3;
}
.neon-card:hover::before { transform:scaleX(1); }
.neon-card:hover {
  transform:translateY(-8px); border-color:#00e5ff;
  box-shadow:0 25px 50px rgba(0,229,255,.2);
}
.neon-card-img {
  aspect-ratio:16/10; overflow:hidden;
  position:relative; background:#000;
}
.neon-card-img img { width:100%; height:100%; object-fit:cover; transition:.8s; }
.neon-card:hover .neon-card-img img { transform:scale(1.1); }
.neon-card-status {
  position:absolute; top:16px; left:16px;
  padding:6px 12px; background:#ff3d00; color:#fff;
  font-family:'Orbitron',sans-serif; font-size:10px;
  letter-spacing:2px; font-weight:700;
  clip-path:polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
}
.neon-card-body { padding:24px; }
.neon-card-brand {
  font-size:11px; color:#00e5ff; letter-spacing:3px;
  text-transform:uppercase; font-weight:700; margin-bottom:8px;
}
.neon-card-title {
  font-family:'Orbitron',sans-serif; font-size:22px;
  font-weight:700; margin-bottom:16px; letter-spacing:-.5px;
}
.neon-card-specs {
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
  padding:16px 0; border-top:1px solid #1a1d28;
  border-bottom:1px solid #1a1d28; margin-bottom:20px;
}
.neon-card-specs div { font-size:12px; color:#6b7280; }
.neon-card-specs strong {
  display:block; color:#e8eaf0; font-family:'Orbitron',sans-serif;
  font-size:13px; margin-top:3px; font-weight:700;
}
.neon-card-price {
  font-family:'Orbitron',sans-serif; font-size:26px; font-weight:900;
  background:linear-gradient(135deg, #00e5ff, #ff3d00);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* =========================================================
   TEMA 4 — CARBON
   Hero editorial left, masonry grid, menu fullscreen
   ========================================================= */
body[data-theme="carbon"] {
  background:#0a0a0a; color:#fafafa; font-family:'Archivo',sans-serif;
}
body[data-theme="carbon"]::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(45deg, rgba(255,255,255,.015) 25%, transparent 25%),
    linear-gradient(-45deg, rgba(255,255,255,.015) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, rgba(255,255,255,.015) 75%),
    linear-gradient(-45deg, transparent 75%, rgba(255,255,255,.015) 75%);
  background-size:5px 5px;

/* ==================== RENDER ==================== */
const templates = {
  aurum: aurumTpl,
  nordic: nordicTpl,
  neon: neonTpl,
  carbon: carbonTpl,
  forest: forestTpl,
};

const app = document.getElementById('app');
const html = document.documentElement;
const buttons = document.querySelectorAll('.theme-btn');

function render(theme) {
  html.setAttribute('data-theme', theme);
  document.body.setAttribute('data-theme', theme);
  app.innerHTML = templates[theme];
  window.scrollTo(0, 0);
  buttons.forEach(b => b.classList.toggle('active', b.dataset.set === theme));
}

buttons.forEach(btn => {
  btn.addEventListener('click', () => render(btn.dataset.set));
});

document.addEventListener('keydown', (e) => {
  const map = { '1':'aurum', '2':'nordic', '3':'neon', '4':'carbon', '5':'forest' };
  if (map[e.key]) render(map[e.key]);
});

/* Start */
render('aurum');
